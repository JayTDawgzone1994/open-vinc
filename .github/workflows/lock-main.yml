name: Guard Main and Develop Branches

on:
  push:
    branches:
      - main
      - develop

jobs:
  reject-others:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Pusher Identity
        run: |
          ALLOWED_USER="JayTDawgzone1994"
          ACTOR="${{ github.actor }}"
          TARGET_BRANCH="${{ github.ref_name }}"
          
          echo "當前推送分支: $TARGET_BRANCH"
          echo "當前推送者為: $ACTOR"
          
          if [ "$ACTOR" != "$ALLOWED_USER" ]; then
            echo "=========================================================="
            echo " 錯誤：[ 安全防禦觸發 ]"
            echo " 為了保護專案架構，所有人皆禁止直接 push 到 $TARGET_BRANCH 分支！"
            echo " 請將程式碼 push 到您自己的功能分支（例如 feature/xxx），"
            echo " 並在 GitHub 網頁上建立 Pull Request 提交給管理員審查合併。"
            echo "=========================================================="
            exit 1
          fi
          
          echo "驗證成功：專案擁有者本人操作，放行。"